<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto Game LITE</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a3140;
      --text: #e6e8ee;
      --muted: #8b93a7;
      --ok: #3dd68c;
      --warn: #f5a524;
      --err: #f31260;
      --info: #66b3ff;
      --btn: #2b3344;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #12151c;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { font-size: 15px; margin: 0; letter-spacing: 0.04em; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .muted { color: var(--muted); }
    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
      color: var(--muted);
      background: var(--panel);
    }
    button, .btn {
      background: var(--btn);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: #1e3a6e; border-color: #3b6fd4; }
    button.danger { background: #3a1520; border-color: #8b2340; }
    button.ok { background: #143528; border-color: #2f8f5b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main { padding: 14px 16px 40px; display: grid; gap: 14px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    label { display: block; color: var(--muted); margin-bottom: 4px; font-size: 11px; }
    input, select, textarea {
      width: 100%;
      background: #0d0f14;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 8px;
      font: inherit;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; font-size: 11px; }
    .state-RUNNING, .state-LOGGING_IN { color: var(--ok); }
    .state-ERROR { color: var(--err); }
    .state-STOPPED, .state-IDLE { color: var(--muted); }
    .state-READY, .state-WAITING { color: var(--info); }
    .features {
      display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px;
    }
    .features label.chk {
      display: inline-flex; gap: 4px; align-items: center;
      color: var(--text); margin: 0; font-size: 12px;
      border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px;
      background: #12161f;
    }
    .features input { width: auto; }
    .logs {
      max-height: 220px; overflow: auto;
      background: #0b0d12; border: 1px solid var(--border);
      border-radius: 6px; padding: 8px; font-size: 11px;
    }
    .log-ERROR { color: var(--err); }
    .log-WARN { color: var(--warn); }
    .log-SUCCESS { color: var(--ok); }
    .log-INFO { color: var(--info); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .errbox { color: var(--err); margin-top: 8px; white-space: pre-wrap; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
    details summary { cursor: pointer; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <h1>AUTO GAME · LITE</h1>
      <span class="pill" id="statsPill">...</span>
    </div>
    <div class="row">
      <button class="ok" id="btnStartAll">Start All</button>
      <button class="danger" id="btnStopAll">Stop All</button>
      <button id="btnRefresh">Refresh</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="grid2">
        <div>
          <label>Email</label>
          <input id="email" placeholder="account@email.com" autocomplete="username" />
        </div>
        <div>
          <label>Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>
      <div class="features" id="newFeatures" style="margin-top:10px"></div>
      <div class="actions">
        <button class="primary" id="btnAdd">+ Thêm account</button>
      </div>
      <div class="hint">
        Treo 24/7 trên Render free: tạo cron ngoài (cron-job.org) ping <code>/ping</code> mỗi 10–12 phút.
        Mở UI kèm <code>?key=LITE_API_KEY</code> nếu đã bật bảo mật.
      </div>
      <div class="errbox" id="globalErr"></div>
    </div>

    <div id="accounts"></div>
  </main>

  <script>
    const qs = new URLSearchParams(location.search);
    let API_KEY = qs.get("key") || localStorage.getItem("lite_api_key") || "";
    if (qs.get("key")) localStorage.setItem("lite_api_key", qs.get("key"));

    // Nếu chưa có key: hỏi 1 lần (khi server bật LITE_API_KEY)
    async function ensureApiKey() {
      try {
        const r = await fetch("/api/status", { headers: API_KEY ? { "x-api-key": API_KEY } : {} });
        if (r.status !== 401) return;
        const k = prompt("Nhập LITE_API_KEY (env trên Render):");
        if (k) {
          API_KEY = k.trim();
          localStorage.setItem("lite_api_key", API_KEY);
        }
      } catch (_) { /* ignore */ }
    }

    const FEATURE_DEFAULT = [
      "farm","buff","claim_exp","world_boss","breakthrough","achievement","mail",
      "maze","auto_equip","craft","body_cult","onboarding_claim","world_cup_checkin"
    ];
    const FEATURE_LABELS = {
      farm: "Farm", buff: "Buff", claim_exp: "Claim EXP", world_boss: "World Boss",
      breakthrough: "Đột phá", achievement: "Thành tựu", mail: "Mail",
      maze: "Mê cung", auto_equip: "Auto equip", craft: "Craft",
      body_cult: "Luyện thể", onboarding_claim: "Onboarding", world_cup_checkin: "WC checkin"
    };
    const DEFAULT_ON = new Set(["farm","buff","claim_exp","breakthrough","world_boss","achievement","mail"]);

    async function api(path, opts = {}) {
      const headers = Object.assign({ "content-type": "application/json" }, opts.headers || {});
      if (API_KEY) headers["x-api-key"] = API_KEY;
      const res = await fetch(path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText || "API error");
      return data;
    }

    function fmt(v) {
      if (v === undefined || v === null || v === "") return "?";
      return v;
    }

    function renderNewFeatures() {
      const box = document.getElementById("newFeatures");
      box.innerHTML = FEATURE_DEFAULT.map(id => `
        <label class="chk">
          <input type="checkbox" data-nf="${id}" ${DEFAULT_ON.has(id) ? "checked" : ""} />
          ${FEATURE_LABELS[id] || id}
        </label>
      `).join("");
    }

    function featureChecks(acc) {
      return FEATURE_DEFAULT.map(id => {
        const on = acc.features?.[id]?.enabled;
        const st = acc.features?.[id]?.status || "OFF";
        return `<label class="chk"><input type="checkbox" data-f="${id}" data-acc="${acc.id}" ${on ? "checked" : ""}/> ${FEATURE_LABELS[id] || id} <span class="muted">[${st}]</span></label>`;
      }).join("");
    }

    function logHtml(logs) {
      if (!logs?.length) return '<div class="muted">Chưa có log</div>';
      return logs.slice(0, 40).map(l => {
        const t = (l.time || "").slice(11, 19);
        return `<div class="log-${l.level}">[${t}] [${l.module}] ${l.message}</div>`;
      }).join("");
    }

    function renderAccounts(accounts) {
      const root = document.getElementById("accounts");
      if (!accounts.length) {
        root.innerHTML = '<div class="panel muted">Chưa có account. Thêm email/password phía trên.</div>';
        return;
      }
      root.innerHTML = accounts.map(acc => `
        <div class="panel" data-id="${acc.id}">
          <div class="row" style="justify-content:space-between">
            <div>
              <strong>${acc.characterName || acc.email}</strong>
              <span class="muted"> · ${acc.email}</span>
              <div class="muted" style="margin-top:2px">
                ID: ${fmt(acc.characterId)} · Lv ${fmt(acc.level)} · Rank ${fmt(acc.rankLabel)} · Score ${fmt(acc.totalScore)}
                · VIP ${fmt(acc.vipLevel)} · LS ${fmt(acc.spiritStones)} · Công ${fmt(acc.gold)}
                · EXP ${fmt(acc.expCurrent)}/${fmt(acc.expMax)}
              </div>
            </div>
            <div style="text-align:right">
              <div class="state-${acc.state}">${acc.running ? "● " : "○ "}${acc.state}</div>
              <div class="muted">${acc.activeTask || ""}</div>
              ${acc.errorMessage ? `<div class="errbox">${acc.errorMessage}</div>` : ""}
            </div>
          </div>
          <div class="features">${featureChecks(acc)}</div>
          <div class="actions">
            <button class="primary" data-act="check" data-id="${acc.id}">Kiểm tra</button>
            <button class="ok" data-act="start" data-id="${acc.id}" ${acc.running ? "disabled" : ""}>Start treo</button>
            <button class="danger" data-act="stop" data-id="${acc.id}" ${!acc.running ? "disabled" : ""}>Stop</button>
            <button data-act="savef" data-id="${acc.id}">Lưu features</button>
            <button class="danger" data-act="del" data-id="${acc.id}">Xóa</button>
          </div>
          <details style="margin-top:8px" open>
            <summary>Logs</summary>
            <div class="logs">${logHtml(acc.logs)}</div>
          </details>
        </div>
      `).join("");
    }

    async function refresh() {
      try {
        document.getElementById("globalErr").textContent = "";
        const [st, acc] = await Promise.all([
          api("/api/status"),
          api("/api/accounts"),
        ]);
        const s = st.stats || {};
        document.getElementById("statsPill").textContent =
          `acc ${s.runningAccounts || 0}/${s.totalAccounts || 0} · mem ${s.memoryMB || "?"}MB · up ${s.uptimeSec || 0}s · ping ${st.pingCount || 0}`;
        renderAccounts(acc.accounts || []);
      } catch (e) {
        document.getElementById("globalErr").textContent = e.message || String(e);
      }
    }

    document.getElementById("btnAdd").onclick = async () => {
      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const enabled = [...document.querySelectorAll("[data-nf]")].filter(el => el.checked).map(el => el.dataset.nf);
        await api("/api/accounts", { method: "POST", body: JSON.stringify({ email, password, enabled }) });
        document.getElementById("password").value = "";
        await refresh();
      } catch (e) {
        document.getElementById("globalErr").textContent = e.message;
      }
    };

    document.getElementById("btnRefresh").onclick = refresh;
    document.getElementById("btnStartAll").onclick = async () => {
      try { await api("/api/start-all", { method: "POST", body: "{}" }); await refresh(); }
      catch (e) { document.getElementById("globalErr").textContent = e.message; }
    };
    document.getElementById("btnStopAll").onclick = async () => {
      try { await api("/api/stop-all", { method: "POST", body: "{}" }); await refresh(); }
      catch (e) { document.getElementById("globalErr").textContent = e.message; }
    };

    document.getElementById("accounts").onclick = async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      try {
        document.getElementById("globalErr").textContent = "";
        if (act === "check") await api(`/api/accounts/${id}/check`, { method: "POST", body: "{}" });
        if (act === "start") await api(`/api/accounts/${id}/start`, { method: "POST", body: "{}" });
        if (act === "stop") await api(`/api/accounts/${id}/stop`, { method: "POST", body: "{}" });
        if (act === "del") {
          if (!confirm("Xóa account này?")) return;
          await api(`/api/accounts/${id}`, { method: "DELETE" });
        }
        if (act === "savef") {
          const panel = btn.closest(".panel");
          const body = {};
          panel.querySelectorAll("input[data-f]").forEach(el => {
            body[el.dataset.f] = { enabled: el.checked };
          });
          await api(`/api/accounts/${id}/features`, { method: "PATCH", body: JSON.stringify(body) });
        }
        await refresh();
      } catch (e) {
        document.getElementById("globalErr").textContent = e.message;
      }
    };

    renderNewFeatures();
    ensureApiKey().then(refresh);
    setInterval(refresh, 5000);
  </script>
</body>
</html>
