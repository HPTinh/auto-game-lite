<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto Lite</title>
  <style>
    :root {
      --bg:#0e1014; --card:#161a22; --line:#2a3140; --tx:#e8eaef; --mu:#8b93a7;
      --ok:#3dd68c; --err:#f31260; --info:#6db3ff; --btn:#232a38; --acc:#4d7cff;
    }
    *{box-sizing:border-box}
    body{margin:0;font:13px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
    header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);background:#12151c;position:sticky;top:0;z-index:20}
    h1{font-size:14px;margin:0}
    .mu{color:var(--mu)}
    .pill{font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
    button{background:var(--btn);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}
    button:hover{border-color:var(--acc)}
    button.p{background:#1a3260;border-color:#3b6fd4}
    button.g{background:#143528;border-color:#2f8f5b}
    button.r{background:#3a1520;border-color:#8b2340}
    button:disabled{opacity:.45;cursor:not-allowed}
    main{padding:10px 12px 28px;max-width:1100px;margin:0 auto}
    .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:end;margin-bottom:10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
    .bar label{display:block;font-size:10px;color:var(--mu);margin-bottom:2px}
    .bar input{background:#0d0f14;border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:6px 8px;min-width:160px}
    .msg{font-size:12px;min-height:16px;margin:4px 0 8px}
    .msg.e{color:var(--err)}.msg.o{color:var(--ok)}
    table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
    th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{font-size:11px;color:var(--mu);font-weight:600;background:#12161f}
    tr:last-child td{border-bottom:0}
    .name{font-weight:600}
    .st{font-size:11px}
    .st.on{color:var(--ok)}.st.off{color:var(--mu)}.st.err{color:var(--err)}.st.run{color:var(--info)}
    .feats{display:flex;flex-wrap:wrap;gap:4px}
    .chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;background:#12161f;cursor:pointer;user-select:none}
    .chip.on{border-color:#2f8f5b;background:#0f2419}
    .chip input{margin:0}
    .chip button.gear{border:0;background:transparent;color:var(--mu);padding:0 2px;font-size:12px;line-height:1}
    .chip button.gear:hover{color:var(--info)}
    .acts{display:flex;flex-wrap:wrap;gap:4px}
    .logs{max-height:72px;overflow:auto;font:11px/1.35 ui-monospace,Consolas,monospace;background:#0b0d12;border:1px solid var(--line);border-radius:4px;padding:6px;margin-top:6px}
    .L-ERROR{color:var(--err)}.L-WARN{color:#f5a524}.L-SUCCESS{color:var(--ok)}.L-INFO{color:var(--info)}
    /* modal */
    .mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
    .mask.show{display:flex}
    .modal{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:85vh;overflow:auto}
    .modal.wide{width:min(560px,100%)}
    .modal h2{margin:0 0 10px;font-size:14px}
    .f{margin-bottom:8px}
    .f label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px}
    .f input,.f select,.f textarea{width:100%;background:#0d0f14;border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:6px 8px;font:inherit}
    .f.chk{display:flex;align-items:center;gap:6px}
    .f.chk label{margin:0;color:var(--tx);font-size:12px}
    .f.chk input{width:auto}
    .modal .row{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .rlist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#0b0d12}
    .ritem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px;cursor:pointer}
    .ritem:hover{background:#1a2230}
    .ritem.on{background:#1a2a18;border-left:2px solid #3dd68c}
    .ritem .rc{font-family:ui-monospace,Consolas,monospace;color:#f5a524;font-size:11px}
    .ritem .meta{font-size:10px;color:var(--mu);margin-top:2px}
    .tag{display:inline-block;padding:0 5px;border-radius:3px;background:#1a2030;color:#c8d0e0;font-size:10px;margin-right:3px}
    .empty{padding:16px;color:var(--mu);border:1px dashed var(--line);border-radius:8px;text-align:center}
  </style>
</head>
<body>
  <header>
    <div style="display:flex;gap:8px;align-items:center">
      <h1>AUTO LITE</h1>
      <span class="pill" id="stats">...</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="g" id="startAll">Start all</button>
      <button class="r" id="stopAll">Stop all</button>
      <button id="btnExport" title="Tải file backup account+setting" style="display:none">Export</button>
      <button id="btnImport" title="Nạp file backup" style="display:none">Import</button>
      <button id="refresh">↻</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <main>
    <div class="bar">
      <div>
        <label>Email</label>
        <input id="email" placeholder="email" autocomplete="username" />
      </div>
      <div>
        <label>Password</label>
        <input id="password" type="password" placeholder="password" autocomplete="current-password" />
      </div>
      <button class="p" id="btnAdd">Thêm + Check</button>
    </div>
    <div class="mu" style="font-size:11px;margin:-4px 0 8px">
      Account + setting tự backup trình duyệt. Trùng email = cập nhật password, <b>không mất setting</b>.
      Sau redeploy Render: mở lại web 1 lần để tự khôi phục.
    </div>
    <div class="msg" id="msg"></div>
    <div id="list"></div>
  </main>

  <div class="mask" id="mask">
    <div class="modal" id="modal">
      <h2 id="modalTitle">Setting</h2>
      <div id="modalBody"></div>
      <div class="row">
        <button id="modalCancel">Huỷ</button>
        <button class="p" id="modalSave">Lưu</button>
      </div>
    </div>
  </div>

  <script>
    const FEATURES = [
      "farm","buff","claim_exp","world_boss","breakthrough","achievement","mail","maze","pvp","rank_challenge","nhap_mong","khoi_loi","ki_ngo","vip_daily",
      "auto_equip","craft","body_cult","hoang_co","ngu_hanh_thap"
    ];
    const LABELS = {
      farm:"Farm", buff:"Buff", claim_exp:"EXP", world_boss:"W.Boss", breakthrough:"Đột phá",
      achievement:"Thành tựu", mail:"Mail", maze:"Mê cung", pvp:"PVP", rank_challenge:"Buff PVP",
      nhap_mong:"Nhập Mộng", khoi_loi:"Khôi Lỗi",
      ki_ngo:"Kì ngộ", vip_daily:"VIP daily",
      auto_equip:"Equip", craft:"Craft", body_cult:"Luyện thể",
      hoang_co:"Hoàng Cổ",
      ngu_hanh_thap:"Ngũ Hành Tháp"
    };
    const DEFAULT_ON = new Set(["farm","buff","claim_exp","breakthrough","world_boss","achievement","mail"]);

    const FIELDS = {
      farm: [
        {k:"target_order",l:"Ưu tiên đánh",t:"select",o:[
          "boss_elite","boss_elite_normal","boss","elite","normal","elite_normal","smart"

        {k:"multi_channel",l:"Farm đa kênh",t:"bool"},
        {k:"channel",l:"Kênh (đơn)",t:"number",min:1,max:99},
        {k:"from_channel",l:"Kênh từ (đa)",t:"number",min:1,max:99},
        {k:"to_channel",l:"Kênh đến (đa)",t:"number",min:1,max:99},
        {k:"farm_realm_tier_override",l:"Map / cảnh giới",t:"select",o:["auto","lk","tc","kd","na","ht","lh"]},
        {k:"prefer_free_mobs",l:"Chỉ farm mob free (sống, không bị đánh)",t:"bool"},
        {k:"smart_rebirth_farm",l:"Theo nhiệm vụ trùng sinh",t:"bool"},

        {k:"mp_potion_buy_qty",l:"Mua mỗi lần (shop)",t:"select",o:["10","1"], hint:"Chỉ mua pill_lk_mp; mặc định 10"},

        {k:"daily_completed",l:"Đã đánh hôm nay (tự ≤ số trận)",t:"number",min:0},

      ],
      rank_challenge: [
        {k:"board_code",l:"Board (auto/lk/tc/kd/na/ht/lh)",t:"select",o:["auto","lk","tc","kd","na","ht","lh"]},
        {k:"daily_target",l:"Số lần WIN muốn đạt / ngày",t:"number",min:1,max:200},
        {k:"slot_min",l:"Slot bắt đầu (vd 1)",t:"number",min:1,max:20},
        {k:"slot_max",l:"Slot tối đa (vd 9)",t:"number",min:1,max:20},
        {k:"max_hunt",l:"Farm tối đa N slot đã WIN",t:"number",min:1,max:5},

        {k:"max_fights_per_tick",l:"Số trận / lần check",t:"number",min:1,max:30},
        {k:"delay_ms",l:"Delay giữa trận (ms)",t:"number",min:500},
        {k:"daily_completed",l:"Đã WIN hôm nay (tự đếm)",t:"number",min:0},
        {k:"lose_streak",l:"Chuỗi thua hiện tại (tự)",t:"number",min:0},
        {k:"daily_date",l:"Ngày đếm (tự)",t:"text"},
        {k:"daily_locked",l:"Đủ / dừng — chờ 00h",t:"bool"},
      ],
      nhap_mong: [
        {k:"prefer_choice",l:"Ưu tiên đáp án",t:"select",o:["safe","gamble","first"]},
        {k:"use_free",l:"Dùng lượt free",t:"bool"},
        {k:"use_paid",l:"Dùng lượt trả phí (bạc)",t:"bool"},
        {k:"max_runs_per_cycle",l:"Số run / lần check",t:"number",min:1,max:30},
        {k:"max_answers_per_cycle",l:"Max câu trả lời / check",t:"number",min:1,max:200},
        {k:"max_inline_wait_sec",l:"Chờ inline tối đa (giây)",t:"number",min:0,max:600},
        {k:"interval_minutes",l:"Hẹn lại khi hết lượt (phút)",t:"number",min:5},
      ],
      khoi_loi: [
        {k:"interval_hours",l:"Chu kỳ claim (giờ, min 2)",t:"number",min:2,max:48},
        {k:"only_with_pending",l:"Chỉ claim khi có pending",t:"bool"},
        {k:"claim_delay_ms",l:"Delay giữa puppet (ms)",t:"number",min:200,max:5000},
      ],
      ki_ngo: [
        {k:"max_runs_per_check",l:"Max lần / vòng",t:"number",min:1,max:100},
        {k:"continue_delay_seconds",l:"Hẹn lại khi chưa đủ (giây)",t:"number",min:30},
        {k:"daily_count",l:"Đã chạy (tự đếm)",t:"number",min:0},
        {k:"daily_limit",l:"Giới hạn ngày (tự)",t:"number",min:0},
        {k:"completed_today",l:"Đủ ngày — chờ 12h VN",t:"bool"},
      ],
      vip_daily: [
        {k:"auto_claim_artifacts",l:"Tự claim VIP artifacts",t:"bool"},
        {k:"claimed_today",l:"Hôm nay đã claim (tự)",t:"bool"},
        {k:"daily_date",l:"Ngày claim (YYYY-MM-DD, tự)",t:"text"},
        {k:"last_claim_at",l:"Lần claim gần nhất (tự)",t:"text"},
        {k:"vip_level",l:"VIP level (tự)",t:"number",min:0},
      ],
      maze: [
        {k:"tier",l:"Bậc (1-6)",t:"number",min:1,max:6},
        {k:"run_count",l:"Số lần / ngày",t:"number",min:1,max:50},
        {k:"max_passes",l:"Max passes",t:"number",min:1},
        {k:"auto_boss",l:"Tự boss",t:"bool"},
        {k:"auto_claim_final",l:"Nhận quà",t:"bool"},
        {k:"daily_completed",l:"Đã chạy hôm nay (tự đếm)",t:"number",min:0},
        {k:"daily_date",l:"Ngày đếm (YYYY-MM-DD, tự)",t:"text"},
        {k:"daily_locked",l:"Đã đủ hôm nay — chờ 00h",t:"bool"},
      ],
      buff: [
        {k:"interval_seconds",l:"Chu kỳ (s)",t:"number",min:30},
        {k:"enable_formation_buff",l:"Trận pháp",t:"bool"},
        {k:"formation_item_code",l:"Mã trận",t:"text"},
        {k:"enable_talisman_buff",l:"Phù",t:"bool"},
        {k:"talisman_item_code",l:"Mã phù",t:"text"},
      ],
      claim_exp: [{k:"interval_minutes",l:"Chu kỳ (phút)",t:"number",min:1}],
      // world_boss: không setting — mở modal hiện hướng dẫn auto
      world_boss: [],
      breakthrough: [
        {k:"interval_seconds",l:"Chu kỳ (s)",t:"number",min:10},
        {k:"pill_item_codes",l:"Mã đan (xuống dòng)",t:"textarea"},
        {k:"auto_buy_pill",l:"Tự mua đan",t:"bool"},
        {k:"buy_qty",l:"SL mua",t:"number",min:1},
      ],
      achievement: [{k:"interval_minutes",l:"Chu kỳ (phút)",t:"number",min:1}],
      mail: [{k:"claim_mail",l:"Claim mail",t:"bool"}],
      auto_equip: [
        {k:"interval_seconds",l:"Chu kỳ (s)",t:"number",min:30},
        {k:"auto_equip",l:"Tự mặc",t:"bool"},
      ],
      // craft UI riêng (4 category + quick VIP) — FIELDS fallback
      craft: [
        {k:"category",l:"Mục craft",t:"select",o:["alchemy","forging","talisman","formation"]},
        {k:"recipe_code",l:"Recipe code",t:"text"},
        {k:"tier",l:"Tier",t:"select",o:["all","lk","tc","kd","na","ht","lh"]},
        {k:"times_per_run",l:"Lần/vòng",t:"number",min:1,max:50},
        {k:"interval_seconds",l:"Chu kỳ manual (s)",t:"number",min:3},
        {k:"use_quick_craft",l:"Craft nhanh VIP≥5 (rpc_craft_auto)",t:"bool"},
        {k:"quick_craft_delay_ms",l:"Delay craft nhanh (ms, min 3000)",t:"number",min:3000,max:60000},
        {k:"pause_on_fail_minutes",l:"Nghỉ khi lỗi (phút)",t:"number",min:1},
        {k:"auto_load_recipes",l:"Tự tải list nếu rỗng",t:"bool"},
        {k:"auto_open_containers",l:"Thiếu NL → mở rương",t:"bool"},
        {k:"auto_use_recovery_items",l:"Thiếu STA/thần hồn → đan thấp→cao",t:"bool"},
        {k:"max_recovery_uses",l:"Tối đa viên uống / lần thiếu",t:"number",min:1,max:30},
      ],
      body_cult: [
        {k:"body_cult_element",l:"Hệ",t:"select",o:["metal","wood","water","fire","earth"]},
        {k:"body_cult_session_type",l:"Session",t:"select",o:["long","short"]},
      ],
      // hoang_co: UI riêng (load list bang) — FIELDS fallback
      hoang_co: [
        {k:"auto_break_flag",l:"Phá cờ (cắm → xây → phá)",t:"bool"},
        {k:"target_clan_name",l:"Bang hội cần phá",t:"text"},
        {k:"flee_on_enemy_near",l:"Địch trong 3 ô → chạy cờ mình",t:"bool"},
        {k:"auto_place",l:"Cắm cờ (mở rộng base)",t:"bool"},
        {k:"auto_build",l:"Xây cờ (mở rộng)",t:"bool"},
        {k:"auto_defend",l:"Thủ cờ",t:"bool"},
        {k:"auto_central",l:"Central (thủ ↔ công)",t:"bool"},
      ],
      /** Zero-config: chỉ bật feature. Các field dưới = trạng thái tự cập nhật */
      ngu_hanh_thap: [
        {k:"display_highest",l:"Highest đã clear (tự)",t:"number",min:0},
        {k:"display_next",l:"Tầng sắp đánh (tự)",t:"number",min:1},
        {k:"display_sweep_charges",l:"Càn quét free còn (tự)",t:"number",min:0},
        {k:"lost_today",l:"Đã thua hôm nay — chờ 00h (tự)",t:"bool"},
        {k:"swept_today",l:"Đã càn quét hôm nay (tự)",t:"bool"},
      ],
    };

    /** Feature chỉ hiện khi đã mở pass backup (giống Export/Import) */
    const HIDDEN_FEATURES_UNTIL_BACKUP = new Set(["hoang_co"]);
    function visibleFeatures() {
      return FEATURES.filter((fid) => {
        if (HIDDEN_FEATURES_UNTIL_BACKUP.has(fid) && !backupUnlocked) return false;
        return true;
      });
    }

    let API_KEY = new URLSearchParams(location.search).get("key") || localStorage.getItem("lite_api_key") || "";
    if (new URLSearchParams(location.search).get("key")) localStorage.setItem("lite_api_key", API_KEY);

    /**
     * Export/Import: luôn ẩn với pass web thường (0000).
     * Chỉ hiện sau khi double-click AUTO LITE + nhập đúng LITE_BACKUP_KEY (pass 2 trên Render).
     * Pass 2 lưu sessionStorage (đóng tab = ẩn lại). API backup cũng chặn nếu sai pass 2.
     */
    const BACKUP_SESSION_KEY = "lite_backup_key_session";
    let BACKUP_KEY_PASS = sessionStorage.getItem(BACKUP_SESSION_KEY) || "";
    let backupUnlocked = false;

    function updateBackupButtonsVisibility() {
      const show = backupUnlocked && Boolean(BACKUP_KEY_PASS);
      const exp = $("btnExport");
      const imp = $("btnImport");
      if (exp) exp.style.display = show ? "" : "none";
      if (imp) imp.style.display = show ? "" : "none";
      // Hiện/ẩn chip Hoàng Cổ theo pass backup
      try {
        if (typeof render === "function" && Array.isArray(accounts) && accounts.length) render();
      } catch (_) {}
    }

    async function unlockBackupWithPass(pass) {
      const key = String(pass || "").trim();
      if (!key) {
        BACKUP_KEY_PASS = "";
        backupUnlocked = false;
        sessionStorage.removeItem(BACKUP_SESSION_KEY);
        updateBackupButtonsVisibility();
        return { ok: false, error: "Đã khóa Export/Import" };
      }
      // Xác thực với server (pass 2 = LITE_BACKUP_KEY)
      const data = await api("/api/backup/unlock", {
        method: "POST",
        body: JSON.stringify({ backupKey: key }),
        headers: { "x-backup-key": key },
        _skipBackupHeader: true, // dùng key vừa nhập, không lấy session cũ
        _backupKeyOverride: key,
      });
      BACKUP_KEY_PASS = key;
      backupUnlocked = true;
      sessionStorage.setItem(BACKUP_SESSION_KEY, key);
      updateBackupButtonsVisibility();
      return data;
    }

    function lockBackupUi() {
      BACKUP_KEY_PASS = "";
      backupUnlocked = false;
      sessionStorage.removeItem(BACKUP_SESSION_KEY);
      updateBackupButtonsVisibility();
    }

    const LOCAL_BACKUP_STORAGE = "auto_lite_accounts_backup_v1";
    let accounts = [];
    let modal = null; // {accId, featureId, draft}
    let busy = false;
    let didAutoRestore = false;

    function saveLocalBackup(data) {
      try {
        if (!data?.accounts?.length) return;
        localStorage.setItem(LOCAL_BACKUP_STORAGE, JSON.stringify({
          version: 1,
          updatedAt: new Date().toISOString(),
          accounts: data.accounts,
        }));
      } catch (_) {}
    }

    function readLocalBackup() {
      try {
        const raw = localStorage.getItem(LOCAL_BACKUP_STORAGE);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    /** Chỉ khi đã mở khóa pass 2 — im lặng nếu chưa unlock */
    async function pullAndCacheBackup() {
      if (!backupUnlocked || !BACKUP_KEY_PASS) return null;
      try {
        const data = await api("/api/backup");
        if (data?.accounts?.length) saveLocalBackup(data);
        return data;
      } catch {
        return null;
      }
    }

    async function autoRestoreIfEmpty() {
      if (didAutoRestore) return false;
      didAutoRestore = true;
      // Cần pass 2 mới restore full password — người thường (0000) bỏ qua im lặng
      if (!backupUnlocked || !BACKUP_KEY_PASS) return false;
      const local = readLocalBackup();
      if (!local?.accounts?.length) return false;
      try {
        const cur = await api("/api/accounts");
        if ((cur.accounts || []).length > 0) {
          await pullAndCacheBackup();
          return false;
        }
        const r = await api("/api/backup/restore", {
          method: "POST",
          body: JSON.stringify(local),

        msg(`Đã khôi phục ${r.imported || 0} account từ backup trình duyệt (settings giữ nguyên)`, true);

    async function api(path, opts={}) {
      const headers = Object.assign({"content-type":"application/json"}, opts.headers||{});
      if (API_KEY) headers["x-api-key"] = API_KEY;
      // Gắn pass 2 cho API backup (sau khi unlock)
      if (!opts._skipBackupHeader) {
        const bk = opts._backupKeyOverride || BACKUP_KEY_PASS;
        if (bk) headers["x-backup-key"] = bk;
      } else if (opts._backupKeyOverride) {
        headers["x-backup-key"] = opts._backupKeyOverride;
      }
      const res = await fetch(path, {...opts, headers});
      const data = await res.json().catch(()=>({}));
      if (res.status === 401 && !opts._retried) {
        const k = prompt("LITE_API_KEY (pass web):");
        if (k) {
          API_KEY = k.trim();
          localStorage.setItem("lite_api_key", API_KEY);
          return api(path, {...opts, _retried:true});
        }
      }
      if (!res.ok) throw new Error(data.error || res.statusText || "API error");
      return data;
    }

    /** Thử khôi phục session unlock trong cùng tab (F5) */
    async function tryRestoreBackupSession() {
      if (!BACKUP_KEY_PASS) {
        backupUnlocked = false;
        updateBackupButtonsVisibility();
        return;
      }
      try {
        await api("/api/backup/unlock", {
          method: "POST",
          body: JSON.stringify({ backupKey: BACKUP_KEY_PASS }),
          headers: { "x-backup-key": BACKUP_KEY_PASS },
          _backupKeyOverride: BACKUP_KEY_PASS,
        });
        backupUnlocked = true;
      } catch {
        lockBackupUi();
      }
      updateBackupButtonsVisibility();
    }

    function logsHtml(logs) {
      if (!logs?.length) return '<span class="mu">Chưa có log</span>';
      // Ưu tiên hiện WORLD_BOSS + FARM (WB dễ bị farm đẩy mất)
      const list = Array.isArray(logs) ? logs.slice() : [];
      const wb = list.filter(l => l.module === "WORLD_BOSS");
      const other = list.filter(l => l.module !== "WORLD_BOSS");
      const merged = [...wb.slice(0, 8), ...other].slice(0, 16);
      return merged.map(l => {
        const t=(l.time||"").slice(11,19);
        const hi = l.module === "WORLD_BOSS" ? "font-weight:600" : "";
        return `<div class="L-${l.level}" style="${hi}">[${t}][${esc(l.module)}] ${esc(l.message)}</div>`;

      const t = String(tier || "all").toLowerCase();
      const q = String(search || "").trim().toLowerCase();
      return (Array.isArray(cache) ? cache : []).filter(r => {
        if (t !== "all" && craftRecipeTier(r) !== t) return false;
        if (!q) return true;
        const hay = [r.recipe_code, r.output_code, r.kindLabel, r.output_rarity, r.requirementText, r.displayName]
          .map(x => String(x || "").toLowerCase()).join(" ");
        return hay.includes(q);

      if (r === "formation" || r === "array" || r === "tran_phap") return "formation";
      if (r === "alchemy" || r === "luyen_dan") return "alchemy";

    function bindCraftModalEvents() {
      const body = $("modalBody");
      if (!body || !modal || modal.featureId !== "craft") return;

      const refreshList = () => {
        // sync draft from inputs first
        modal.draft = { ...modal.draft, ...readDraftFromModal() };
        const listEl = $("craftRecipeList");
        if (listEl) listEl.innerHTML = craftRecipeListHtml(modal.draft);
        bindPickButtons();
      };

      const bindPickButtons = () => {
        body.querySelectorAll("[data-pick-recipe]").forEach(btn => {
          btn.onclick = () => {
            const code = btn.getAttribute("data-pick-recipe") || "";
            const out = btn.getAttribute("data-pick-out") || "";
            const tier = btn.getAttribute("data-pick-tier") || "";
            modal.draft.recipe_code = code;
            modal.draft.selected_output_code = out;
            modal.draft.selected_recipe_tier = tier;
            const codeInp = $("craftRecipeCode");
            const outInp = $("craftOut");
            const tierInp = $("craftSelTier");
            if (codeInp) codeInp.value = code;
            if (outInp) outInp.value = out;
            if (tierInp) tierInp.value = tier;
            refreshList();
            msg(`Đã chọn ${code}`, true);
          };
        });
      };

      const tierEl = $("craftTier");
      const searchEl = $("craftSearch");
      const catEl = $("craftCategory");
      if (tierEl) tierEl.onchange = refreshList;
      if (searchEl) searchEl.oninput = refreshList;
      if (catEl) {
        catEl.onchange = () => {
          // đổi category → clear cache/recipe (list khác hẳn)
          const draft = readDraftFromModal();
          const nextCat = craftCatNorm(draft.category);
          const prevCat = craftCatNorm(modal.draft.category);
          modal.draft = {
            ...modal.draft,
            ...draft,
            category: nextCat,
          };
          if (nextCat !== prevCat) {
            modal.draft.recipe_cache = [];
            modal.draft.recipe_cache_at = "";
            modal.draft.recipe_code = "";
            modal.draft.selected_output_code = "";
            modal.draft.selected_recipe_tier = "";
            modal.draft.recipe_search = "";
          }
          $("modalBody").innerHTML = craftModalHtml(modal.draft);
          bindCraftModalEvents();
        };
      }

      const loadBtn = $("btnLoadRecipes");
      if (loadBtn) {
        loadBtn.onclick = async () => {
          if (busy) return;
          busy = true;
          loadBtn.disabled = true;
          loadBtn.textContent = "Đang tải...";
          try {
            const draft = readDraftFromModal();
            const category = craftCatNorm(draft.category || modal.draft.category);
            const res = await api(`/api/accounts/${modal.accId}/craft/recipes`, {
              method: "POST",
              body: JSON.stringify({
                category,
                tier: draft.tier || "all",
                search: draft.recipe_search || "",
              }),
            });
            const recipes = res.allRecipes || res.recipes || [];
            modal.draft = {
              ...modal.draft,
              ...draft,
              category: res.category || category,
              recipe_cache: recipes,
              recipe_cache_at: res.cacheAt || new Date().toISOString(),
            };
            // update local accounts
            const acc = accounts.find(a => a.id === modal.accId);
            if (acc) {
              if (!acc.features.craft) acc.features.craft = { enabled:false, status:"OFF", settings:{} };
              acc.features.craft.settings = {
                ...acc.features.craft.settings,
                category: modal.draft.category,
                recipe_cache: recipes,
                recipe_cache_at: modal.draft.recipe_cache_at,
              };
            }
            // re-render craft body keeping draft
            $("modalBody").innerHTML = craftModalHtml(modal.draft);
            bindCraftModalEvents();
            msg(`Đã tải ${recipes.length} recipe ${craftCatLabel(modal.draft.category)}`, true);
          } catch (e) {
            msg(e.message || "Tải recipe fail", false);
          } finally {
            busy = false;
            const b = $("btnLoadRecipes");
            if (b) { b.disabled = false; b.textContent = "Tải list"; }
          }
        };
      }

      bindPickButtons();
    }

      const n = Array.isArray(draft.enemy_clan_list) ? draft.enemy_clan_list.length : 0;
      return `
        <div class="f chk"><input type="checkbox" data-k="auto_break_flag" ${bool("auto_break_flag", false)?"checked":""}/><label><b>Phá cờ</b> (near → giữa+siege · chưa near → cắm mở rộng)</label></div>
        <div class="f">
          <label>Bang hội cần phá (chọn từ map)</label>
          <div style="display:flex;gap:6px;align-items:center">
            <select data-k="target_clan_name" id="hcClanSelect" style="flex:1">${hoangCoClanOptions(draft)}</select>
            <button type="button" class="p" id="btnLoadHcClans" style="white-space:nowrap">Tải list</button>
          </div>
          <div class="mu" style="font-size:10px;margin-top:4px" id="hcClanHint">
            ${n ? `Đã tải <b>${n}</b> bang · ${esc(at)}` : "Bấm <b>Tải list</b> (cần Check account + event map)"}
          </div>
        </div>
        <div class="mu" style="font-size:10px;margin:4px 0 8px;opacity:.85">
          Ưu tiên cờ địch <b>gần mình</b>, <b>không có người thủ</b>. Near → giữa + siege.
          <code>not_near</code> → cắm bridge. Cờ có thủ địch → <b>né</b>, qua cờ trống.
        </div>
        <div class="f chk"><input type="checkbox" data-k="break_hop" ${bool("break_hop", true)?"checked":""}/><label>not_near → cắm/xây bridge (kế hoạch hop)</label></div>
        <div class="f chk"><input type="checkbox" data-k="skip_defended_flags" ${bool("skip_defended_flags", true)?"checked":""}/><label>Né cờ có người thủ clan khác (tránh combat)</label></div>
        <div class="mu" style="font-size:10px;margin:2px 0 8px;opacity:.8">Bridge: neo cờ mình → hop ≤3 ô → xây dở trước → đủ chạm (cheby≤1) → vào giữa phá. Full cờ/slot xây → chỉ xây.</div>
        <div class="f chk"><input type="checkbox" data-k="flee_on_enemy_near" ${bool("flee_on_enemy_near", false)?"checked":""}/><label>Địch gần → chạy cờ mình (thường tắt khi phá)</label></div>
        <div class="f chk"><input type="checkbox" data-k="attack_near_resource" ${bool("attack_near_resource", true)?"checked":""}/><label>Lúc bridge/xây: chip resource gần (bỏ qua nếu có thủ clan khác)</label></div>
        <hr style="border:none;border-top:1px solid #333;margin:10px 0"/>
        <div class="mu" style="font-size:11px;margin-bottom:6px">Chế độ khác (khi <b>tắt</b> Phá cờ):</div>
        <div class="f chk"><input type="checkbox" data-k="auto_place" ${bool("auto_place", true)?"checked":""}/><label>Cắm cờ (mở rộng)</label></div>
        <div class="f chk"><input type="checkbox" data-k="auto_build" ${bool("auto_build", true)?"checked":""}/><label>Xây cờ (mở rộng)</label></div>
        <div class="f chk"><input type="checkbox" data-k="auto_defend" ${bool("auto_defend", true)?"checked":""}/><label>Thủ cờ</label></div>
        <div class="f chk"><input type="checkbox" data-k="auto_central" ${bool("auto_central", true)?"checked":""}/><label>Central (thủ ↔ công)</label></div>
      `;
    }

    function bindHoangCoModalEvents() {
      const loadBtn = $("btnLoadHcClans");
      if (!loadBtn || !modal || modal.featureId !== "hoang_co") return;
      loadBtn.onclick = async () => {
        if (busy) return;
        busy = true;
        loadBtn.disabled = true;
        loadBtn.textContent = "Đang tải…";
        try {
          const data = await api(`/api/accounts/${modal.accId}/hoang-co/clans`);
          const clans = data.clans || [];
          modal.draft.enemy_clan_list = clans;
          modal.draft.enemy_clan_list_at = data.at || new Date().toISOString();
          // giữ selection nếu vẫn còn
          const sel = $("hcClanSelect");
          const prev = sel ? sel.value : modal.draft.target_clan_name || "";
          if (sel) {
            modal.draft.target_clan_name = prev;
            sel.innerHTML = hoangCoClanOptions(modal.draft);
            if (prev) sel.value = prev;
          }
          const hint = $("hcClanHint");
          if (hint) {
            hint.innerHTML = `Đã tải <b>${clans.length}</b> bang địch` +
              (data.myClanName ? ` · mình: ${esc(data.myClanName)}` : "") +
              (clans.length ? "" : " — map trống / chưa event?");
          }
          msg(clans.length ? `List bang: ${clans.map(c=>c.clan_name).slice(0,5).join(", ")}${clans.length>5?"…":""}` : "Không có bang địch trên map", true);
        } catch (e) {
          msg(e.message || "Tải list bang fail", false);
        } finally {
          busy = false;
          loadBtn.disabled = false;
          loadBtn.textContent = "Tải list";
        }
      };
    }

    function fieldHtml(f, val) {
      if (f.t === "bool") {
        const on = val===true || val==="true" || val===1 || val==="1";
        return `<div class="f chk"><input type="checkbox" data-k="${f.k}" ${on?"checked":""}/><label>${esc(f.l)}</label></div>`;
      }
      if (f.t === "select") {
        const labels = {
          boss_elite: "Boss → Elite",
          boss_elite_normal: "Boss → Elite → Normal",
          boss: "Chỉ Boss",
          elite: "Chỉ Elite",
          normal: "Chỉ Normal",
          elite_normal: "Elite → Normal",
          smart: "Smart (nhiệm vụ)",
          safe: "An toàn (safe)",
          gamble: "Mạo hiểm (gamble)",
          first: "Luôn chọn đáp án đầu",
          alchemy: "Luyện đan (alchemy)",
          forging: "Luyện khí (forging)",
          talisman: "Phù lục (talisman)",
          formation: "Trận pháp (formation)",
          auto: "auto (theo cảnh giới)",
          lk: "lk · Luyện Khí",
          tc: "tc · Trúc Cơ",
          kd: "kd · Kim Đan",
          na: "na · Nguyên Anh",
          ht: "ht · Hoá Thần",
          lh: "lh · Luyện Hư",
        };
        return `<div class="f"><label>${esc(f.l)}</label><select data-k="${f.k}">${(f.o||[]).map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?"selected":""}>${esc(labels[o]||o)}</option>`).join("")}</select>${f.hint?`<div class="mu" style="font-size:10px;margin-top:2px">${esc(f.hint)}</div>`:""}</div>`;
      }
      if (f.t === "textarea") {
        return `<div class="f"><label>${esc(f.l)}</label><textarea rows="2" data-k="${f.k}">${esc(val??"")}</textarea></div>`;
      }
      const min=f.min!=null?`min="${f.min}"`:"";
      const max=f.max!=null?`max="${f.max}"`:"";
      return `<div class="f"><label>${esc(f.l)}</label><input type="${f.t==="number"?"number":"text"}" ${min} ${max} data-k="${f.k}" value="${esc(val??"")}"/></div>`;
    }

    function closeModal() {
      modal = null;
      $("mask").classList.remove("show");
      $("modal")?.classList.remove("wide");
      render();
    }

    function readDraftFromModal() {
      if (!modal) return {};
      const body = $("modalBody");
      const draft = { ...modal.draft };
      body.querySelectorAll("[data-k]").forEach(el => {
        const k = el.getAttribute("data-k");
        if (el.type === "checkbox") draft[k] = el.checked;
        else if (el.type === "number") draft[k] = el.value === "" ? null : Number(el.value);
        else draft[k] = el.value;
      });
      return draft;
    }

    async function saveModal() {
      if (!modal || busy) return;
      busy = true;
      try {
        const settings = readDraftFromModal();
        // giữ cache recipe (không có input data-k) + chuẩn hoá category craft
        if (modal.featureId === "craft") {
          settings.category = craftCatNorm(settings.category || modal.draft?.category || "alchemy");
          if (Array.isArray(modal.draft?.recipe_cache)) settings.recipe_cache = modal.draft.recipe_cache;
          if (modal.draft?.recipe_cache_at) settings.recipe_cache_at = modal.draft.recipe_cache_at;
          if (!settings.recipe_code && modal.draft?.recipe_code) settings.recipe_code = modal.draft.recipe_code;
        }
        if (modal.featureId === "hoang_co") {
          if (Array.isArray(modal.draft?.enemy_clan_list)) settings.enemy_clan_list = modal.draft.enemy_clan_list;
          if (modal.draft?.enemy_clan_list_at) settings.enemy_clan_list_at = modal.draft.enemy_clan_list_at;
        }
        const { accId, featureId } = modal;
        await api(`/api/accounts/${accId}/features`, {
          method: "PATCH",
          body: JSON.stringify({ [featureId]: { settings } }),
        });
        // cập nhật local ngay — không để refresh ghi đè bằng data cũ
        const acc = accounts.find(a => a.id === accId);
        if (acc) {
          if (!acc.features[featureId]) acc.features[featureId] = { enabled:false, status:"OFF", settings:{} };
          acc.features[featureId].settings = { ...acc.features[featureId].settings, ...settings };
        }
        msg(`Đã lưu setting ${LABELS[featureId]||featureId}${featureId==="craft" && settings.recipe_code ? " · "+settings.recipe_code : ""}`, true);
        closeModal();
        await pullAndCacheBackup();
        await load(true);
      } catch (e) {
        msg(e.message, false);
      } finally {
        busy = false;
      }
    }

    async function load(forceRender) {
      if (modal && !forceRender) {
        try {
          const [st, acc] = await Promise.all([api("/api/status"), api("/api/accounts")]);
          const s = st.stats||{};
          $("stats").textContent = `${s.runningAccounts||0}/${s.totalAccounts||0} · ${s.memoryMB||"?"}MB · ${s.uptimeSec||0}s`;
          accounts = acc.accounts || [];
        } catch(_){}
        return;
      }
      try {
        const [st, acc] = await Promise.all([api("/api/status"), api("/api/accounts")]);
        const s = st.stats||{};
        $("stats").textContent = `${s.runningAccounts||0}/${s.totalAccounts||0} · ${s.memoryMB||"?"}MB · ${s.uptimeSec||0}s`;
        accounts = acc.accounts || [];
        if (!accounts.length) {
          const restored = await autoRestoreIfEmpty();
          if (restored) {
            const acc2 = await api("/api/accounts");
            accounts = acc2.accounts || [];
          }
        } else {
          // cache backup (async, không chặn UI)
          pullAndCacheBackup();
        }
        if (!modal) render();
      } catch (e) {
        msg(e.message, false);
      }
    }

    $("btnAdd").onclick = async () => {
      try {
        msg("");
        const email = $("email").value.trim();
        const password = $("password").value;
        const enabled = [...DEFAULT_ON];
        const r = await api("/api/accounts", { method:"POST", body: JSON.stringify({ email, password, enabled, checkNow:true }) });
        $("password").value = "";
        msg(r.account ? "OK — account đã lưu (trùng email thì chỉ update password, giữ setting)" : "OK", true);
        await pullAndCacheBackup();
        await load(true);
      } catch (e) {
        msg(e.message, false);
        await pullAndCacheBackup();
        await load(true);
      }
    };

    $("btnExport").onclick = async () => {
      try {
        const data = await api("/api/backup");
        saveLocalBackup(data);
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `auto-lite-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        msg(`Export ${data.accounts?.length||0} account (+ cache trình duyệt)`, true);
      } catch (e) {
        msg(e.message, false);
      }
    };

    $("btnImport").onclick = () => $("importFile").click();
    $("importFile").onchange = async (ev) => {
      const file = ev.target.files?.[0];
      ev.target.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        const r = await api("/api/backup/restore", { method: "POST", body: JSON.stringify(json) });
        saveLocalBackup(json);
        msg(r.message || "Import OK", true);
        await load(true);
      } catch (e) {
        msg(e.message || "Import fail", false);
      }
    };

    $("startAll").onclick = async () => { try { await api("/api/start-all",{method:"POST",body:"{}"}); msg("Start all",true); await load(true);} catch(e){msg(e.message,false);} };
    $("stopAll").onclick = async () => { try { await api("/api/stop-all",{method:"POST",body:"{}"}); msg("Stop all",true); await load(true);} catch(e){msg(e.message,false);} };
    $("refresh").onclick = () => load(true);

    // Double-click "AUTO LITE" → nhập pass 2 (Export/Import + Hoàng Cổ)
    document.querySelector("h1")?.addEventListener("dblclick", async () => {
      if (backupUnlocked) {
        if (confirm("OK?")) {
          lockBackupUi();
          msg("", true);
          try { render(); } catch (_) {}
        }
        return;
      }
      const k = prompt("Nhập pass");
      if (k === null) return;
      if (!String(k).trim()) return;
      try {
        await unlockBackupWithPass(k);
        msg("", true);
        try { render(); } catch (_) {}
      } catch {
        lockBackupUi();
        msg("Sai", false);
        try { render(); } catch (_) {}
      }
    });

    // Ẩn nút ngay; nếu session còn pass 2 thì verify lại với server
    updateBackupButtonsVisibility();
    void tryRestoreBackupSession();
    $("modalCancel").onclick = closeModal;
    $("modalSave").onclick = saveModal;
    $("mask").addEventListener("click", (e) => { if (e.target === $("mask")) closeModal(); });

    $("list").addEventListener("click", async (e) => {
      const gear = e.target.closest("button[data-set]");
      if (gear) {
        e.preventDefault();
        e.stopPropagation();
        openModal(gear.dataset.set, gear.dataset.f);
        return;
      }
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      try {
        msg("");
        if (act === "check") {
          await api(`/api/accounts/${id}/check`, { method:"POST", body:"{}" });
          msg("Check OK", true);
        } else if (act === "start") {
          msg("Đang Start...", true);
          await api(`/api/accounts/${id}/start`, { method:"POST", body:"{}" });
          msg("Đã Start — xem log bên dưới", true);
        } else if (act === "stop") {
          await api(`/api/accounts/${id}/stop`, { method:"POST", body:"{}" });
          msg("Đã Stop", true);
        } else if (act === "del") {
          if (!confirm("Xóa account?")) return;
          await api(`/api/accounts/${id}`, { method:"DELETE" });
        }
        await load(true);
      } catch (err) {
        msg(err.message, false);
        await load(true);
      }
    });

    // toggle feature — lưu ngay
    $("list").addEventListener("change", async (e) => {
      const t = e.target;
      if (!t.matches?.("input[data-tog]")) return;
      const id = t.dataset.tog;
      const fid = t.dataset.f;
      const enabled = t.checked;
      t.closest(".chip")?.classList.toggle("on", enabled);
      try {
        await api(`/api/accounts/${id}/features`, {
          method: "PATCH",
          body: JSON.stringify({ [fid]: { enabled } }),
        });
        const acc = accounts.find(a => a.id === id);
        if (acc?.features?.[fid]) {
          acc.features[fid].enabled = enabled;
          acc.features[fid].status = enabled ? "PENDING" : "OFF";
        }
        msg(`${LABELS[fid]}: ${enabled?"ON":"OFF"}`, true);
        pullAndCacheBackup();
      } catch (err) {
        t.checked = !enabled;
        t.closest(".chip")?.classList.toggle("on", !enabled);
        msg(err.message, false);
      }
    });

    load(true);
    setInterval(() => load(false), 3000);
  </script>
</body>
</html>
